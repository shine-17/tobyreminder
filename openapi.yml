openapi: 3.1.0
info:
  title: Toby Reminder API
  description: Apple Reminders 웹 클론 — ReminderList API
  version: 0.1.0

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/lists:
    get:
      operationId: getAllLists
      summary: 전체 리스트 조회
      description: 모든 리스트를 displayOrder 순으로 반환한다.
      tags: [Lists]
      responses:
        "200":
          description: 리스트 배열
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReminderListResponse"

    post:
      operationId: createList
      summary: 리스트 생성
      description: 새 리스트를 생성한다. displayOrder는 자동 부여된다.
      tags: [Lists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "201":
          description: 생성된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"

  /api/lists/{id}:
    parameters:
      - $ref: "#/components/parameters/ListId"

    get:
      operationId: getListById
      summary: 리스트 단건 조회
      tags: [Lists]
      responses:
        "200":
          description: 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateList
      summary: 리스트 수정
      description: 이름, 색상, 아이콘을 수정한다. null 필드는 기존 값을 유지한다.
      tags: [Lists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderListRequest"
      responses:
        "200":
          description: 수정된 리스트
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteList
      summary: 리스트 삭제
      tags: [Lists]
      responses:
        "204":
          description: 삭제 성공
        "404":
          $ref: "#/components/responses/NotFound"

  /api/lists/reorder:
    patch:
      operationId: reorderLists
      summary: 리스트 순서 변경
      description: 전달된 ID 배열 순서대로 displayOrder를 재배치한다.
      tags: [Lists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "204":
          description: 순서 변경 성공

components:
  parameters:
    ListId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: 리스트 ID

  schemas:
    ReminderListRequest:
      type: object
      properties:
        name:
          type: string
          example: Shopping
        color:
          type: string
          description: "HEX 색상 코드"
          example: "#34C759"
        icon:
          type: string
          nullable: true
          example: cart

    ReminderListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Shopping
        color:
          type: string
          example: "#34C759"
        icon:
          type: string
          nullable: true
          example: cart
        displayOrder:
          type: integer
          example: 0
        isDefault:
          type: boolean
          example: false
        reminderCount:
          type: integer
          format: int64
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReorderRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [3, 1, 2]

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          example: Resource Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "ReminderList not found: 99"
        instance:
          type: string
          format: uri

  responses:
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
